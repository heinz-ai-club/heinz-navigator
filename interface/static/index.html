<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heinz Navigator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Heinz Navigator</h1>
      <p class="subtitle">Cited answers about courses, policies, and careers at Heinz College.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Features">
      <button role="tab" id="tab-ask" aria-controls="panel-ask" aria-selected="true">Ask Heinz</button>
      <button role="tab" id="tab-check" aria-controls="panel-check" aria-selected="false">Requirement Checker</button>
    </div>

    <!-- Tab 1: Ask Heinz -->
    <section id="panel-ask" role="tabpanel" aria-labelledby="tab-ask">
      <form id="ask-form">
        <label for="question">Your question</label>
        <textarea id="question" rows="3" maxlength="1000"
          placeholder="Can I take a course pass/fail?"></textarea>
        <button type="submit" id="ask-button">Ask</button>
      </form>
      <div id="ask-result" aria-live="polite"></div>
    </section>

    <!-- Tab 2: Requirement Checker -->
    <section id="panel-check" role="tabpanel" aria-labelledby="tab-check" hidden>
      <form id="check-form">
        <label for="program">Program</label>
        <input id="program" type="text" placeholder="MS-AIM">

        <label for="courses">Completed courses (one per line, or separated by commas)</label>
        <textarea id="courses" rows="5" placeholder="95-888&#10;94-806"></textarea>

        <button type="submit" id="check-button">Check</button>
      </form>
      <div id="check-result" aria-live="polite"></div>
    </section>

    <footer>
      Answers come from public Heinz documents. Always confirm important decisions with your
      advisor. Please do not enter personal information.
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
